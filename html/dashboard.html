<div class="section" id="resources-section">
    <h2>My Resources</h2>
    <div class="add-resource-form">
        <h3>Add New Resource</h3>
        <form id="resource-form">
            <div class="form-group">
                <label for="resource-title">Title</label>
                <input type="text" id="resource-title" required>
            </div>
            <div class="form-group">
                <label for="resource-link">Link</label>
                <input type="url" id="resource-link" required>
            </div>
            <div class="form-group">
                <label for="resource-description">Description</label>
                <textarea id="resource-description" rows="3" required></textarea>
            </div>
            <div class="form-group checkbox-container">
                <input type="checkbox" id="resource-public" checked>
                <label for="resource-public">Make this resource public</label>
            </div>
            <button type="submit" class="btn-primary">Add Resource</button>
        </form>
    </div>
    <div class="resources-container">
        <div id="resources-list" class="resources-list">
            <!-- Resources will be loaded here -->
        </div>
    </div>
</div>

<div class="section public-resources" id="public-resources-section">
    <h2>Public Resources</h2>
    <p class="section-description">Resources shared by other alumni</p>
    <div id="public-resources-list" class="resources-list">
        <!-- Public resources will be loaded here -->
    </div>
</div>
