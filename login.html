<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zeal Institute Alumni Network</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <span>ZEAL</span> Alumni
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="dashboard.html" id="dashboard-link">Dashboard</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Log in to access your alumni dashboard</p>
                </div>

                <div id="login-message" class="success-message" style="display: none;"></div>

                <form id="login-form">
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Email Address" required>
                        <div class="error-message" id="email-error"></div>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" placeholder="Password" required>
                        <div class="error-message" id="password-error"></div>
                    </div>
                    <div class="form-options">
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>

                <div class="form-divider">
                    <span>OR</span>
                </div>

                <button class="btn-secondary" onclick="window.location.href='register.html'">
                    Create New Account
                </button>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
